                          <span className="material-symbols-outlined text-[24px]">create_new_folder</span>
                        </div>
                        <span className="font-semibold text-sm">Buka Kelas Baru</span>
                        <span className="text-[11px] text-on-surface-variant">Kelas semester ganjil &amp; tetapkan dosen</span>
                      </button>
                    </div>
                  )}

                  {modalType === 'USER' && (
                    <>
                      <div>
                        <label className="text-xs font-semibold uppercase tracking-wider text-on-surface-variant">Nama Lengkap &amp; Gelar</label>
                        <input
                          type="text"
                          placeholder="cth: Ir. Siti Aminah, M.T."
                          className="w-full mt-1 px-3 py-2 rounded-lg bg-surface-container-high border border-outline-variant/40 text-on-surface text-sm focus:outline-none focus:border-primary"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="text-xs font-semibold uppercase tracking-wider text-on-surface-variant">Peran (Role)</label>
                          <select className="w-full mt-1 px-3 py-2 rounded-lg bg-surface-container-high border border-outline-variant/40 text-on-surface text-sm focus:outline-none focus:border-primary">
                            <option value="MAHASISWA">Mahasiswa</option>
                            <option value="DOSEN">Dosen Pengampu</option>
                            <option value="ADMIN">Administrator PTIK</option>
                          </select>
                        </div>
                        <div>
                          <label className="text-xs font-semibold uppercase tracking-wider text-on-surface-variant">NIM / NIDN / NIP</label>
                          <input
                            type="text"
                            placeholder="cth: 0628098701"
                            className="w-full mt-1 px-3 py-2 rounded-lg bg-surface-container-high border border-outline-variant/40 text-on-surface text-sm focus:outline-none focus:border-primary"
                          />
                        </div>
                      </div>
                    </>
                  )}

                  {modalType === 'CLASS' && (
                    <>
                      <div>
                        <label className="text-xs font-semibold uppercase tracking-wider text-on-surface-variant">Mata Kuliah</label>
                        <select className="w-full mt-1 px-3 py-2 rounded-lg bg-surface-container-high border border-outline-variant/40 text-on-surface text-sm focus:outline-none focus:border-primary">
                          <option>TIF-301 - Rekayasa Perangkat Lunak (3 SKS)</option>
                          <option>TIF-305 - Pemrograman Berorientasi Objek (3 SKS)</option>
                          <option>TIF-402 - Arsitektur Enterprise (2 SKS)</option>
                        </select>
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="text-xs font-semibold uppercase tracking-wider text-on-surface-variant">Kode / Nama Kelas</label>
                          <input
                            type="text"
                            placeholder="cth: TI-A (Pagi)"
                            className="w-full mt-1 px-3 py-2 rounded-lg bg-surface-container-high border border-outline-variant/40 text-on-surface text-sm focus:outline-none focus:border-primary"
                          />
                        </div>
                        <div>
                          <label className="text-xs font-semibold uppercase tracking-wider text-on-surface-variant">Dosen Pengampu</label>
                          <select className="w-full mt-1 px-3 py-2 rounded-lg bg-surface-container-high border border-outline-variant/40 text-on-surface text-sm focus:outline-none focus:border-primary">
                            <option>Dr. Bayu Pratama, M.Kom.</option>
                            <option>Dr. Awan Rosi, M.Kom.</option>
                            <option>Ir. Nina Kartika, M.T.</option>
                          </select>
                        </div>
                      </div>
                    </>
                  )}

                  {modalType === 'ENROLL' && (
                    <>
                      <div>
                        <label className="text-xs font-semibold uppercase tracking-wider text-on-surface-variant">Pilih Kelas Sasaran</label>
                        <select className="w-full mt-1 px-3 py-2 rounded-lg bg-surface-container-high border border-outline-variant/40 text-on-surface text-sm focus:outline-none focus:border-primary">
                          <option>TIF-301 Kelas TI-A (RPL)</option>
                          <option>TIF-305 Kelas TI-B (PBO)</option>
                          <option>TIF-402 Kelas TI-A (Enterprise)</option>
                        </select>
                      </div>
                      <div className="p-4 border-2 border-dashed border-outline-variant/50 rounded-xl flex flex-col items-center justify-center gap-1.5 text-center bg-surface-container-high/40">
                        <span className="material-symbols-outlined text-[28px] text-tertiary">upload_file</span>
                        <p className="text-xs font-semibold text-on-surface">Unggah Berkas Mahasiswa (CSV / XLSX)</p>
                        <span className="text-[11px] text-on-surface-variant">Format: NIM, Nama, Program Studi, Angkatan</span>
                      </div>
                    </>
                  )}
                </div>

                {/* Modal Footer */}
                {modalType !== 'QUICK' && (
                  <div className="flex items-center justify-end gap-2 pt-3 border-t border-outline-variant/20">
                    <button
                      type="button"
                      onClick={() => setModalOpen(false)}
                      className="px-4 py-2 rounded-lg text-xs font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors"
                    >
                      Batal
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setModalOpen(false);
                        showToast('Data berhasil disimpan dan disinkronkan ke basis data!');
                      }}
                      className="px-4 py-2 rounded-lg text-xs font-bold bg-primary text-on-primary hover:bg-primary-hover shadow-md transition-colors"
                    >
                      Simpan &amp; Sinkronkan
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DasborAdminApp />);
  </script>
</body>
</html>
