<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen selection:bg-primary-container selection:text-on-primary">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_MODULES = [
      {
        id: 'p1',
        meeting: 'Pertemuan 1',
        status: 'Selesai',
        statusColor: 'text-tertiary',
        title: 'Pengantar Rekayasa Perangkat Lunak & SDLC',
        desc: 'Konsep dasar rekayasa sistem, evolusi perangkat lunak, dan model sekuensial linier waterfall.'
      },
      {
        id: 'p2',
        meeting: 'Pertemuan 2',
        status: 'Selesai',
        statusColor: 'text-tertiary',
        title: 'Agile Methodologies, Scrum Framework',
        desc: 'Siklus sprint planning, backlog grooming, retrospective, dan manajemen artefak Jira.'
      },
      {
        id: 'p3',
        meeting: 'Pertemuan 3',
        status: 'Sedang Berlangsung',
        statusColor: 'text-secondary',
        title: 'Analisis Kebutuhan Sistem & SRS IEEE 830',
        desc: 'Menyusun dokumen software requirements specification fungsional & non-fungsional.',
        isActive: true
      }
    ];

    function UnggahMateriApp() {
      // Shell state
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [activeRole, setActiveRole] = useState('dosen');
      const [activeMenu, setActiveMenu] = useState('unggah-materi-ajar');
      const [serverClock, setServerClock] = useState('08:30:00 WIB');
      const [searchQuery, setSearchQuery] = useState('');
      const [isDarkMode, setIsDarkMode] = useState(true);

      // Modal & Form State
      const [isModalOpen, setIsModalOpen] = useState(true);
      const [isClosingModal, setIsClosingModal] = useState(false);
      const [judulMateri, setJudulMateri] = useState('Modul 3 — Analisis Kebutuhan Sistem & Spesifikasi SRS IEEE 830');
      const [deskripsiMateri, setDeskripsiMateri] = useState('Pelajari format IEEE 830 sebelum kelas praktikum laboratorium. Selesaikan kuis pemahaman mandiri di modul ini paling lambat Jumat pukul 23:59 WIB.');
      const [publishToTimeline, setPublishToTimeline] = useState(true);

      // 6 Validation States: 'a' | 'b' | 'c' | 'd' | 'e' | 'f'
      const [dropzoneState, setDropzoneState] = useState('a');
      const [uploadProgress, setUploadProgress] = useState(64);
      const [selectedFileName, setSelectedFileName] = useState('Modul-03_Analisis_Kebutuhan_IEEE830.pdf');
      const [fileSizeText, setFileSizeText] = useState('1.2 MB');
      const [oversizeDetails, setOversizeDetails] = useState({
        name: 'Slide_Presentasi_Lengkap_Video.pptx',
        size: '12.4 MB',
        excess: '+2.4 MB Berlebih'
      });
      const [rejectedExt, setRejectedExt] = useState('.rar');

      // Module List
      const [modules, setModules] = useState(INITIAL_MODULES);

      // Toast Notification
      const [toast, setToast] = useState({ visible: false, message: '', type: 'info' });

      // File Input Reference
      const fileInputRef = useRef(null);

      // Initialize Theme & Server Clock
      useEffect(() => {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
          setIsDarkMode(false);
          document.documentElement.classList.remove('dark');
        } else {
          setIsDarkMode(true);
          document.documentElement.classList.add('dark');
        }

        const clockInterval = setInterval(() => {
          const now = new Date();
          setServerClock(now.toLocaleTimeString('id-ID') + ' WIB');
        }, 1000);

        return () => clearInterval(clockInterval);
      }, []);

      const toggleTheme = () => {
        setIsDarkMode(prev => {
          const next = !prev;
          if (next) {
            document.documentElement.classList.add('dark');
            localStorage.setItem('theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
          return next;
        });
      };

      const showToast = (message, type = 'info') => {
        setToast({ visible: true, message, type });
        setTimeout(() => setToast(prev => ({ ...prev, visible: false })), 3500);
      };

      // Modal animation handler
      const closeModal = () => {
        setIsClosingModal(true);
        setTimeout(() => {
          setIsModalOpen(false);
          setIsClosingModal(false);
        }, 250);
      };

      const openModal = () => {
        setIsModalOpen(true);
      };

      // Switch Dropzone State
      const switchState = (stateKey) => {
        setDropzoneState(stateKey);
      };

      // Simulate Real File Upload
      const handleFileProcess = (file) => {
        const ext = '.' + file.name.split('.').pop().toLowerCase();
        const allowedExts = ['.pdf', '.docx', '.xlsx', '.zip'];

        if (!allowedExts.includes(ext)) {
          setRejectedExt(ext);
          setDropzoneState('c');
          showToast(`Format berkas ${ext} ditolak. Harap gunakan format .pdf, .docx, .xlsx, atau .zip.`, 'error');
          return;
        }

        const maxBytes = 10 * 1024 * 1024; // 10MB
        if (file.size > maxBytes) {
          const currentMb = (file.size / (1024 * 1024)).toFixed(1);
          const excessMb = ((file.size - maxBytes) / (1024 * 1024)).toFixed(1);
          setOversizeDetails({
            name: file.name,
            size: `${currentMb} MB`,
            excess: `+${excessMb} MB Berlebih`
          });
          setDropzoneState('d');
          showToast(`Ukuran berkas (${currentMb} MB) melebihi batas 10.0 MB.`, 'error');
          return;
        }

        // File is valid: Run uploading simulation
        setSelectedFileName(file.name);
        setFileSizeText((file.size / (1024 * 1024)).toFixed(1) + ' MB');
        setDropzoneState('e');
        setUploadProgress(15);

        let currentP = 15;
        const interval = setInterval(() => {
          currentP += 25;
          if (currentP >= 100) {
            currentP = 100;
            clearInterval(interval);
            setUploadProgress(100);
            setTimeout(() => {
              setDropzoneState('f');
              showToast(`Berkas "${file.name}" berhasil divalidasi dengan checksum SHA-256!`, 'success');
            }, 300);
          } else {
            setUploadProgress(currentP);
          }
        }, 250);
      };

      // File input change
      const handleFileInputChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          handleFileProcess(file);
        }
      };

      // Drag and Drop handlers
      const handleDragOver = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (dropzoneState !== 'b' && dropzoneState !== 'e') {
          setDropzoneState('b');
        }
      };

      const handleDragLeave = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (dropzoneState === 'b') {
          setDropzoneState('a');
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        const file = e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) {
          handleFileProcess(file);
        } else {
          setDropzoneState('a');
        }
      };

      // Default dropzone click demo
      const handleDefaultClick = () => {
        if (fileInputRef.current) {
          fileInputRef.current.click();
        }
      };

      // Form submission
      const handleSubmit = (e) => {
        e.preventDefault();
        if (!judulMateri.trim()) {
          showToast('Harap masukkan judul materi pembelajaran.', 'error');
          return;
        }

        if (dropzoneState === 'c' || dropzoneState === 'd') {
          showToast('Harap perbaiki berkas materi sebelum mengunggah.', 'error');
          return;
        }

        if (dropzoneState === 'e') {
          showToast('Proses unggah berkas sedang berlangsung...', 'info');
          return;
        }

        // Add to weekly modules if not present
        const newModuleId = `mod-${Date.now()}`;
        const newModule = {
          id: newModuleId,
          meeting: 'Pertemuan 3 (Baru)',
          status: 'Materi Siap',
          statusColor: 'text-tertiary',
          title: judulMateri,
          desc: deskripsiMateri || 'Materi perkuliahan baru berhasil diunggah.',
          isActive: false
        };

        setModules(prev => [...prev, newModule]);
        showToast('Materi Pembelajaran berhasil diunggah dan disinkronkan ke cloud SPADA UPGRIS!', 'success');
        closeModal();
      };

      return (
        <div className="bg-surface font-body-md text-on-surface antialiased min-h-screen selection:bg-primary-container selection:text-on-primary">
          {/* Toast Notification */}
          {toast.visible && (
            <div className="fixed top-5 right-5 z-[9999] animate-toast">
              <div
                className={`flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border ${
                  toast.type === 'success'
                    ? 'bg-emerald-900/90 text-emerald-100 border-emerald-500/50'
                    : toast.type === 'error'
                    ? 'bg-rose-950/90 text-rose-100 border-rose-500/50'
                    : 'bg-surface-container-highest text-on-surface border-outline/30'
                }`}
              >
                <span className="material-symbols-outlined text-[20px]">
                  {toast.type === 'success' ? 'check_circle' : toast.type === 'error' ? 'error' : 'info'}
                </span>
                <span className="font-label-md text-label-md">{toast.message}</span>
                <button
                  onClick={() => setToast(prev => ({ ...prev, visible: false }))}
                  className="p-1 hover:opacity-75"
                >
                  <span className="material-symbols-outlined text-[16px]">close</span>
                </button>
              </div>
            </div>
          )}

          {/* Hidden File Input */}
          <input
            ref={fileInputRef}
            type="file"
            accept=".pdf,.docx,.xlsx,.zip"
            className="hidden"
            onChange={handleFileInputChange}
          />

          {/* Fixed Sidebar */}
          <aside
            className={`fixed left-0 top-0 h-full w-[260px] bg-surface-container-low shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-50 flex flex-col justify-between transition-transform duration-300 ${
              sidebarOpen ? 'translate-x-0' : '-translate-x-full'
            }`}
          >
            <div className="flex flex-col flex-1 overflow-y-auto">
              <div className="px-space-md py-space-md bg-surface-container-lowest flex items-center gap-space-sm border-b border-outline-variant/10">
                <div className="w-9 h-9 rounded-lg bg-primary-container flex items-center justify-center shrink-0">
                  <span className="material-symbols-outlined text-on-primary-container text-[20px]">school</span>
                </div>
                <div className="flex flex-col overflow-hidden">
                  <span className="font-title-md text-title-md text-on-surface tracking-tight truncate font-bold">
                    SPADA LMS UPGRIS
                  </span>
                  <span className="font-caption text-caption text-secondary truncate">Team Membangun Negeri</span>
                </div>
              </div>

              <nav className="flex-1 px-space-sm py-space-md space-y-space-md">
                <div className="space-y-space-xs">
                  <div className="px-space-sm py-space-xs font-caption text-caption uppercase tracking-wider text-outline font-semibold">
                    Main Menu
                  </div>
                  <div className="space-y-space-xs">
                    <button
                      onClick={() => setActiveMenu('dasbor-dosen')}
                      className={`w-full flex items-center gap-space-sm px-space-sm py-space-sm rounded-lg font-body-md text-body-md transition-colors text-left ${
                        activeMenu === 'dasbor-dosen'
                          ? 'bg-surface-container-high text-on-surface'
                          : 'text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[18px]">space_dashboard</span>
                      <span>Dasbor Dosen</span>
                    </button>
                    <button
                      onClick={() => setActiveMenu('kelas-diampu')}
                      className={`w-full flex items-center gap-space-sm px-space-sm py-space-sm rounded-lg font-body-md text-body-md transition-colors text-left ${
                        activeMenu === 'kelas-diampu'
                          ? 'bg-surface-container-high text-on-surface'
                          : 'text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[18px]">class</span>
                      <span>Kelas Diampu</span>
                    </button>
                    <button
                      onClick={() => setActiveMenu('panduan-dosen')}
                      className={`w-full flex items-center gap-space-sm px-space-sm py-space-sm rounded-lg font-body-md text-body-md transition-colors text-left ${
                        activeMenu === 'panduan-dosen'
                          ? 'bg-surface-container-high text-on-surface'
                          : 'text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[18px]">menu_book</span>
                      <span>Panduan Dosen</span>
                    </button>
                  </div>
                </div>

                <div className="space-y-space-xs">
                  <div className="px-space-sm py-space-xs font-caption text-caption uppercase tracking-wider text-outline font-semibold">
                    Akademik
                  </div>
                  <div className="space-y-space-xs">
                    <button
                      onClick={() => setActiveMenu('central-timeline')}
                      className="w-full flex items-center gap-space-sm px-space-sm py-space-sm rounded-lg font-body-md text-body-md text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors text-left"
                    >
                      <span className="material-symbols-outlined text-[18px]">calendar_clock</span>
                      <span>Central Timeline & Jadwal</span>
                    </button>
                    <button
                      onClick={() => setActiveMenu('pemeriksaan-tugas')}
                      className="w-full flex items-center gap-space-sm px-space-sm py-space-sm rounded-lg font-body-md text-body-md text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors text-left"
                    >
                      <span className="material-symbols-outlined text-[18px]">assignment_turned_in</span>
                      <span>Pemeriksaan Tugas & Skor</span>
                    </button>
                    <button
                      onClick={() => setActiveMenu('rekap-presensi')}
                      className="w-full flex items-center gap-space-sm px-space-sm py-space-sm rounded-lg font-body-md text-body-md text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors text-left"
                    >
                      <span className="material-symbols-outlined text-[18px]">fact_check</span>
                      <span>Rekap Presensi & Nilai</span>
                    </button>
                  </div>
                </div>

                <div className="space-y-space-xs">
                  <div className="px-space-sm py-space-xs font-caption text-caption uppercase tracking-wider text-outline font-semibold">
                    Manajemen Kelas
                  </div>
                  <div className="space-y-space-xs">
                    <button
                      onClick={() => setActiveMenu('unggah-materi-ajar')}
                      className={`w-full flex items-center gap-space-sm px-space-sm py-space-sm rounded-lg font-body-md text-body-md transition-colors text-left font-medium ${
                        activeMenu === 'unggah-materi-ajar'
                          ? 'bg-primary-container text-on-primary-container shadow-sm'
                          : 'text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[18px]">upload_file</span>
                      <span>Unggah Materi Ajar</span>
                    </button>
                    <button
                      onClick={() => setActiveMenu('bank-kuis-ujian')}
                      className="w-full flex items-center gap-space-sm px-space-sm py-space-sm rounded-lg font-body-md text-body-md text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors text-left"
                    >
                      <span className="material-symbols-outlined text-[18px]">quiz</span>
                      <span>Bank Kuis & Ujian (UTS/UAS)</span>
                    </button>
                  </div>
                </div>
              </nav>
            </div>

            <div className="p-space-md bg-surface-container space-y-space-sm border-t border-outline-variant/10">
              <a
                href="https://upt-ptik.upgris.ac.id"
                target="_blank"
                rel="noreferrer"
                className="w-full flex items-center justify-between text-secondary font-label-sm text-label-sm hover:underline"
              >
                <span>Bantuan & Tiket PTIK</span>
                <span className="material-symbols-outlined text-[16px]">open_in_new</span>
              </a>
              <div className="text-on-surface-variant font-caption text-caption">
                Semester Ganjil 2026/2027<br />
                v2.4.0 (Framework React Standalone)
              </div>
            </div>
          </aside>

          {/* Main Layout Area */}
          <div className={`transition-all duration-300 min-h-screen flex flex-col ${sidebarOpen ? 'md:pl-[260px]' : 'pl-0'}`}>

                          </div>
                          <div className="flex items-center justify-between text-[11px] text-slate-500">
                            <span className="flex items-center gap-1">
                              <span className="w-1.5 h-1.5 rounded-full bg-blue-600 animate-ping"></span>
                              Mentransfer data ke storage cluster UPGRIS...
                            </span>
                            <span>Perkiraan sisa waktu: ~2 detik</span>
                          </div>
                        </div>
                      )}

                      {/* STATE F: SUCCESS / READY (.pdf) */}
                      {dropzoneState === 'f' && (
                        <div
                          id="state-panel-f"
                          aria-live="polite"
                          className="border border-emerald-300 bg-emerald-50/70 rounded-xl p-4 sm:p-5 flex flex-col gap-3 transition-all duration-200"
                        >
                          <div className="flex items-start sm:items-center justify-between gap-3 flex-col sm:flex-row">
                            <div className="flex items-center gap-3 min-w-0">
                              <div className="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0">
                                <span className="material-symbols-outlined text-[24px]">task_alt</span>
                              </div>
                              <div className="flex flex-col min-w-0">
                                <div className="flex items-center gap-2">
                                  <span className="text-[13px] font-bold text-emerald-950 font-body-md truncate">
                                    {selectedFileName}
                                  </span>
                                  <span className="bg-emerald-200/80 text-emerald-800 text-[10px] font-bold uppercase px-1.5 py-0.2 rounded font-caption">
                                    Terverifikasi
                                  </span>
                                </div>
                                <span className="text-[12px] text-emerald-700 font-body-sm">
                                  {fileSizeText} • Lolos Validasi Ekstensi & SHA-256 Checksum
                                </span>
                              </div>
                            </div>
                            <div className="flex items-center gap-2 self-end sm:self-auto shrink-0">
                              <button
                                type="button"
                                onClick={() => showToast(`Membuka pratinjau berkas "${selectedFileName}"...`, 'info')}
                                className="px-2.5 py-1.5 rounded-lg border border-emerald-300 bg-white text-emerald-800 hover:bg-emerald-100 text-[12px] font-semibold flex items-center gap-1 transition-colors"
                              >
                                <span className="material-symbols-outlined text-[15px]">visibility</span>
                                Pratinjau Berkas
                              </button>
                              <button
                                type="button"
                                onClick={() => switchState('a')}
                                className="px-2.5 py-1.5 rounded-lg text-rose-600 hover:text-rose-800 hover:bg-rose-50 text-[12px] font-semibold flex items-center gap-1 transition-colors"
                              >
                                <span className="material-symbols-outlined text-[15px]">delete_outline</span>
                                Ganti
                              </button>
                            </div>
                          </div>
                          <div className="pt-2 border-t border-emerald-200/70 flex items-center justify-between text-[11px] text-emerald-700">
                            <span className="flex items-center gap-1">
                              <span className="material-symbols-outlined text-[14px] text-emerald-600">verified_user</span>
                              Berkas bersih dari malware & enkripsi AES-256 aktif
                            </span>
                            <span className="font-mono">Ready to publish</span>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Publishing Visibility Checkbox */}
                  <div className="pt-1 pb-1">
                    <label className="flex items-center gap-2.5 cursor-pointer select-none">
                      <input
                        type="checkbox"
                        checked={publishToTimeline}
                        onChange={(e) => setPublishToTimeline(e.target.checked)}
                        className="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 focus:ring-offset-0 transition-colors"
                      />
                      <span className="text-[13px] text-slate-700 font-body-sm">
                        Publikasikan langsung ke Linimasa Mahasiswa Kelas TI-A
                      </span>
                    </label>
                  </div>

                  {/* MODAL FOOTER */}
                  <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-4 border-t border-slate-100 mt-1">
                    {/* Security Notice */}
                    <div className="flex items-center gap-1.5 text-slate-500 text-[11px] font-caption max-w-xs">
                      <span className="material-symbols-outlined text-[16px] text-slate-400 shrink-0">enhanced_encryption</span>
                      <span>Tersimpan di Private Storage Terenkripsi (Sesuai BR-009 & NFR-005)</span>
                    </div>

                    {/* Buttons Group */}
                    <div className="flex items-center gap-2.5 w-full sm:w-auto justify-end">
                      <button
                        id="btn-cancel"
                        type="button"
                        onClick={closeModal}
                        className="px-4 py-2.5 rounded-lg text-slate-600 hover:text-slate-800 hover:bg-slate-100 text-[13px] font-semibold font-label-md transition-colors"
                      >
                        Batal
                      </button>
                      <button
                        id="btn-submit-upload"
                        type="submit"
                        disabled={dropzoneState === 'c' || dropzoneState === 'd' || dropzoneState === 'e'}
                        className="w-full sm:w-auto px-5 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-[13px] font-label-md flex items-center justify-center gap-2 shadow-[0_4px_12px_rgba(37,99,235,0.28)] transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                      >
                        {dropzoneState === 'e' ? (
                          <>
                            <span className="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>
                            <span>Sedang Mengunggah ({uploadProgress}%)...</span>
                          </>
                        ) : dropzoneState === 'c' || dropzoneState === 'd' ? (
                          <>
                            <span className="material-symbols-outlined text-[18px]">block</span>
                            <span>Perbaiki Berkas Terlebih Dahulu</span>
                          </>
                        ) : (
                          <>
                            <span className="material-symbols-outlined text-[18px]">upload</span>
                            <span>Unggah Materi Pembelajaran</span>
                          </>
                        )}
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(<UnggahMateriApp />);
  </script>
</body>
</html>
