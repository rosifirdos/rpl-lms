  # ── Users ──
  /api/v1/users:
    get:
      tags: [Users]
      summary: Daftar akun pengguna
      description: Dengan pagination, filter berdasarkan role/status, dan search.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/RoleName'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
      responses:
        '200':
          description: Daftar pengguna
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Detail akun pengguna
      description: Termasuk profil entitas (mahasiswa/dosen/admin) dan daftar role.
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Detail pengguna
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/{id}/roles:
    put:
      tags: [Users]
      summary: Penugasan/pencabutan role pengguna
      description: |
        Hanya **SUPER_ADMIN** yang berhak mengubah role.
        Perubahan dicatat di tabel Audit Log (SRS Bab 35).
      operationId: updateUserRoles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRolesRequest'
      responses:
        '200':
          description: Role berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                      username:
                        type: string
                      oldRoles:
                        type: array
                        items:
                          type: string
                      newRoles:
                        type: array
                        items:
                          type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/users/{id}/status:
    patch:
      tags: [Users]
      summary: Ubah status akun pengguna
      description: |
        Hanya **SUPER_ADMIN** yang berhak mengubah status (ACTIVE, INACTIVE, SUSPENDED).
        Perubahan dicatat di tabel Audit Log.
      operationId: updateUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Status berhasil diperbarui
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── Audit Log ──
  /api/v1/audit-logs:
    get:
      tags: [Audit Log]
      summary: Daftar jejak audit sistem
      description: |
        Memantau seluruh rekaman aksi krusial di sistem.
        Mendukung filter berdasarkan action, entity, userId, rentang tanggal, dan pencarian teks.
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: action
          in: query
          schema:
            type: string
          description: Filter berdasarkan tipe aksi (LOGIN, CREATE_FAKULTAS, dll.)
        - name: entity
          in: query
          schema:
            type: string
          description: Filter berdasarkan nama entitas target
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/SearchParam'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [waktu, action, entity]
            default: waktu
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Daftar audit log
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/audit-logs/{id}:
    get:
      tags: [Audit Log]
      summary: Detail jejak audit
      description: Menampilkan riwayat perubahan detail termasuk `old_values` vs `new_values`.
      operationId: getAuditLogById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Detail audit log
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AuditLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
