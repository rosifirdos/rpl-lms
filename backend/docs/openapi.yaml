                $ref: '#/components/schemas/Notification'

    UnreadCountResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                unread_count:
                  type: integer
                  minimum: 0

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login multi-kredensial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil dan access token diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Kredensial tidak valid
        '403':
          description: Akun berstatus INACTIVE atau SUSPENDED

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Memperbarui token akses via refresh token
      responses:
        '200':
          description: Access token diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Mengakhiri sesi login dan mencabut refresh token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesi berhasil dicabut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Mengajukan permohonan reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Instruksi reset password dikirimkan jika email terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Menyelesaikan pemulihan kata sandi menggunakan token email (FR-003)
      description: >-
        Token mentah diterima melalui tautan email. Token bersifat sekali pakai,
        kedaluwarsa sesuai konfigurasi (default 30 menit), dan setelah sukses
        seluruh refresh token aktif pengguna dicabut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfResetPasswordRequest'
      responses:
        '200':
          description: Kata sandi berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Token tidak valid/kedaluwarsa/terpakai atau password tidak memenuhi kebijakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/reset-password/validate:
    get:
      tags: [Auth]
      summary: Precheck validitas token reset kata sandi (FR-003)
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: Token mentah dari tautan email
      responses:
        '200':
          description: Token masih berlaku
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResetTokenResponse'
        '400':
          description: Token tidak valid atau telah kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/change-password:
    put:
      tags: [Auth]
      summary: Alias penggantian kata sandi mandiri
      deprecated: true
      description: >-
        Alias kompatibilitas untuk `PUT /profile/password`. Gunakan endpoint
        tersebut untuk integrasi baru.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Kata sandi berhasil diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /profile:
    get:
      tags: [Profile]
      summary: Mengambil data profil mandiri
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Informasi profil pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      tags: [Profile]
      summary: Memperbarui data profil mandiri
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /profile/avatar:
    get:
      tags: [Profile]
      summary: Mengunduh berkas foto avatar pengguna saat ini
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Berkas avatar (PNG atau JPEG) dikirim sebagai biner
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Pengguna belum mengunggah avatar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Profile]
      summary: Mengunggah berkas foto avatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar berhasil diunggah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /profile/password:
    put:
      tags: [Profile]
      summary: Mengganti kata sandi mandiri
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Kata sandi berhasil diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /admin/users:
    get:
      tags: [Users]
      summary: Mengambil daftar pengguna dengan filter dan paginasi
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - in: query
          name: role
          schema: { type: string, enum: [admin, dosen, mahasiswa] }
        - in: query
          name: status
          schema: { type: string, enum: [ACTIVE, INACTIVE, SUSPENDED] }
      responses:
        '200':
          description: Daftar pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Users]
      summary: Membuat pengguna baru
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Pengguna berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /admin/users/{id}:
    get:
      tags: [Users]
      summary: Detail akun pengguna berdasarkan ID (Admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Detail pengguna berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      tags: [Users]
      summary: Memperbarui data akun pengguna (Admin, FR-044)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Data pengguna berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /admin/users/{id}/status:
    patch:
      tags: [Users]
      summary: Memperbarui status akun pengguna
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Status pengguna berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /admin/users/{id}/reset-password:
    put:
      tags: [Users]
      summary: Reset kata sandi pengguna oleh administrator
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Kata sandi berhasil direset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /admin/courses:
    get:
      tags: [Courses]
      summary: Mengambil daftar master mata kuliah
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: Daftar mata kuliah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Courses]
      summary: Menambahkan mata kuliah baru
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
