                  type: number
                fully_graded:
                  type: boolean

    QuizResultRosterResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                quiz:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    title:
                      type: string
                    total_points:
                      type: number
                    question_count:
                      type: integer
                    is_published:
                      type: boolean
                total_students:
                  type: integer
                roster:
                  type: array
                  items:
                    type: object
                    properties:
                      attempt_id:
                        type: string
                        format: uuid
                      student_id:
                        type: string
                        format: uuid
                      nim:
                        type: string
                      full_name:
                        type: string
                      status:
                        type: string
                        enum: [IN_PROGRESS, SUBMITTED, GRADED]
                      score:
                        type: number
                        nullable: true
                      started_at:
                        type: string
                        format: date-time
                      submitted_at:
                        type: string
                        format: date-time
                        nullable: true
                      graded_at:
                        type: string
                        format: date-time
                        nullable: true

    Notification:
