            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: Tugas berhasil diterbitkan dan dicatat pada audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
        '400':
          description: Payload tidak valid, perturbuan ujian, atau berkas ditolak
        '403':
          description: Hanya dosen pengampu atau Admin yang berwenang
        '404':
          description: Pertemuan tidak ditemukan

  /classes/{classId}/assignments:
    get:
      tags: [Assignments]
      summary: Daftar tugas kelas
      description: |
        Mahasiswa hanya menerima tugas yang sudah dipublikasikan beserta
        `my_submission` miliknya. Dosen pengampu dan Admin menerima seluruh tugas
        beserta jumlah submission.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: classId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Daftar tugas terurut berdasarkan deadline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentListResponse'
        '403':
          description: Mahasiswa tidak terdaftar atau dosen bukan pengampu
        '404':
          description: Kelas perkuliahan tidak ditemukan

  /assignments/{id}:
    get:
      tags: [Assignments]
      summary: Detail tugas
      description: |
        Mahasiswa menerima instruksi, metadata soal, dan `my_submission`.
        Dosen pengampu/Admin menerima ringkasan roster. Tugas non-publikasi
        disamarkan sebagai 404 bagi mahasiswa.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Detail tugas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentDetailResponse'
        '403':
          description: Pengguna tidak berhak membaca kelas
        '404':
          description: Tugas tidak ditemukan atau belum dipublikasikan
    put:
      tags: [Assignments]
      summary: Perbarui tugas (dan ganti berkas soal bila perlu)
      description: |
        Hanya field yang dikirim yang diubah. Berkas soal dapat diganti melalui
        `multipart/form-data` dengan field `file`; berkas lama dihapus setelah
        pembaruan berhasil.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateAssignmentRequest'
      responses:
        '200':
          description: Tugas diperbarui dan dicatat pada audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
        '400':
          description: Payload tidak valid atau tidak ada data yang diperbarui
        '403':
          description: Hanya dosen pengampu atau Admin yang berwenang
        '404':
          description: Tugas tidak ditemukan
    delete:
      tags: [Assignments]
      summary: Hapus tugas beserta submission dan berkas privatnya
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Tugas, submission, metadata files, dan berkas fisik terhapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Hanya dosen pengampu atau Admin yang berwenang
        '404':
          description: Tugas tidak ditemukan

  /assignments/{id}/download:
    get:
      tags: [Assignments]
      summary: Unduh berkas soal tugas
      description: |
        Mahasiswa terdaftar hanya dapat mengunduh soal tugas yang sudah
        dipublikasikan; dosen pengampu dan Admin dapat mengunduh seluruhnya.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Berkas soal dialirkan dengan Content-Disposition attachment
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Pengguna tidak terdaftar atau bukan dosen pengampu
        '404':
          description: Tugas tidak ditemukan, belum dipublikasikan, atau tanpa berkas soal

  /assignments/{assignmentId}/submissions:
    post:
      tags: [Submissions]
      summary: Unggah atau ganti berkas jawaban tugas
      description: |
        Mahasiswa terdaftar mengunggah jawaban sebelum deadline. `submitted_at`
        memakai jam server dan `is_late` diturunkan dari `due_date`. Submission
        yang sudah dinilai tidak dapat diganti (409).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadSubmissionRequest'
      responses:
        '201':
          description: Jawaban berhasil dikumpulkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '200':
          description: Jawaban berhasil diperbarui (resubmission)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '400':
          description: Berkas tidak valid (ekstensi, ukuran, MIME, atau signature)
        '403':
          description: Mahasiswa tidak terdaftar atau deadline telah berakhir
        '404':
          description: Tugas tidak ditemukan atau belum dipublikasikan
        '409':
          description: Submission sudah dinilai dan tidak dapat diubah
    get:
      tags: [Submissions]
      summary: Roster penilaian tugas
      description: |
        Roster seluruh mahasiswa terdaftar beserta status penyerahan, waktu
        submit, skor, feedback, dan tautan unduh. Hanya dosen pengampu/Admin.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Roster submission beserta ringkasan status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionRosterResponse'
        '403':
          description: Hanya dosen pengampu atau Admin yang boleh melihat roster
        '404':
          description: Tugas tidak ditemukan

  /assignments/{assignmentId}/submission:
    get:
      tags: [Submissions]
      summary: Ambil submission milik mahasiswa sendiri
      description: |
        Mengembalikan submission beserta skor dan feedback milik mahasiswa yang
        login. `data` bernilai `null` bila belum mengumpulkan.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Submission milik mahasiswa (atau null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySubmissionResponse'
        '403':
          description: Mahasiswa tidak terdaftar pada kelas
        '404':
          description: Tugas tidak ditemukan atau belum dipublikasikan

  /submissions/{id}/download:
    get:
      tags: [Submissions]
      summary: Unduh berkas jawaban submission
      description: |
        Mahasiswa hanya dapat mengunduh submission miliknya sendiri; mahasiswa
        lain ditolak 403 (TC-023). Dosen pengampu dan Admin dapat mengunduh
        seluruh submission pada kelasnya.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Berkas jawaban dialirkan dengan Content-Disposition attachment
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Bukan pemilik submission, bukan dosen pengampu, atau bukan Admin
        '404':
          description: Submission atau berkas jawaban tidak ditemukan

  /submissions/{id}/grade:
    put:
      tags: [Submissions]
      summary: Simpan skor 0–100 dan feedback submission
      description: |
        Dosen pengampu/Admin menyimpan skor numerik 0–100 (maksimal 2 desimal)
        dan feedback opsional. Perubahan skor dicatat pada audit log dengan
        nilai lama dan baru (FR-058, TC-024).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeSubmissionRequest'
      responses:
        '200':
          description: Penilaian tersimpan dan dicatat pada audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '400':
          description: Skor di luar 0–100, desimal berlebih, atau feedback terlalu panjang
        '403':
          description: Hanya dosen pengampu atau Admin yang berwenang
        '404':
          description: Submission tidak ditemukan
