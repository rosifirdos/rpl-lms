            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Hanya dosen pengampu atau Admin yang berwenang
        '404':
          description: Tugas tidak ditemukan

  /assignments/{id}/download:
    get:
      tags: [Assignments]
      summary: Unduh berkas soal tugas
      description: |
        Mahasiswa terdaftar hanya dapat mengunduh soal tugas yang sudah
        dipublikasikan; dosen pengampu dan Admin dapat mengunduh seluruhnya.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Berkas soal dialirkan dengan Content-Disposition attachment
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Pengguna tidak terdaftar atau bukan dosen pengampu
        '404':
          description: Tugas tidak ditemukan, belum dipublikasikan, atau tanpa berkas soal

  /assignments/{assignmentId}/submissions:
    post:
      tags: [Submissions]
      summary: Unggah atau ganti berkas jawaban tugas
      description: |
        Mahasiswa terdaftar mengunggah jawaban sebelum deadline. `submitted_at`
        memakai jam server dan `is_late` diturunkan dari `due_date`. Submission
        yang sudah dinilai tidak dapat diganti (409).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadSubmissionRequest'
      responses:
        '201':
          description: Jawaban berhasil dikumpulkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '200':
          description: Jawaban berhasil diperbarui (resubmission)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '400':
          description: Berkas tidak valid (ekstensi, ukuran, MIME, atau signature)
        '403':
          description: Mahasiswa tidak terdaftar atau deadline telah berakhir
        '404':
          description: Tugas tidak ditemukan atau belum dipublikasikan
        '409':
          description: Submission sudah dinilai dan tidak dapat diubah
    get:
      tags: [Submissions]
      summary: Roster penilaian tugas
      description: |
        Roster seluruh mahasiswa terdaftar beserta status penyerahan, waktu
        submit, skor, feedback, dan tautan unduh. Hanya dosen pengampu/Admin.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Roster submission beserta ringkasan status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionRosterResponse'
        '403':
          description: Hanya dosen pengampu atau Admin yang boleh melihat roster
        '404':
          description: Tugas tidak ditemukan

  /assignments/{assignmentId}/submission:
    get:
      tags: [Submissions]
      summary: Ambil submission milik mahasiswa sendiri
      description: |
        Mengembalikan submission beserta skor dan feedback milik mahasiswa yang
        login. `data` bernilai `null` bila belum mengumpulkan.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Submission milik mahasiswa (atau null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySubmissionResponse'
        '403':
          description: Mahasiswa tidak terdaftar pada kelas
        '404':
          description: Tugas tidak ditemukan atau belum dipublikasikan

  /submissions/{id}/download:
    get:
      tags: [Submissions]
      summary: Unduh berkas jawaban submission
      description: |
        Mahasiswa hanya dapat mengunduh submission miliknya sendiri; mahasiswa
        lain ditolak 403 (TC-023). Dosen pengampu dan Admin dapat mengunduh
        seluruh submission pada kelasnya.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Berkas jawaban dialirkan dengan Content-Disposition attachment
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Bukan pemilik submission, bukan dosen pengampu, atau bukan Admin
        '404':
          description: Submission atau berkas jawaban tidak ditemukan

  /submissions/{id}/grade:
    put:
      tags: [Submissions]
      summary: Simpan skor 0â€“100 dan feedback submission
      description: |
        Dosen pengampu/Admin menyimpan skor numerik 0â€“100 (maksimal 2 desimal)
        dan feedback opsional. Perubahan skor dicatat pada audit log dengan
        nilai lama dan baru (FR-058, TC-024).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeSubmissionRequest'
      responses:
        '200':
          description: Penilaian tersimpan dan dicatat pada audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '400':
          description: Skor di luar 0â€“100, desimal berlebih, atau feedback terlalu panjang
        '403':
          description: Hanya dosen pengampu atau Admin yang berwenang
        '404':
          description: Submission tidak ditemukan

  # === MVP 4 - Timeline, Kuis, Notifikasi ===
  /timeline:
    get:
      tags: [Timeline]
      summary: Kronologi akademik gabungan (FR-009 sampai FR-012)
      description: |
        Agregasi tugas terbit, kuis terbit, pertemuan terjadwal, dan ujian pada
        kelas yang diikuti (Mahasiswa) atau diampu (Dosen). Jendela default 30
        hari, item terurut `starts_at` menaik, draft tersembunyi dari Mahasiswa.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: class_id
          schema: { type: string, format: uuid }
        - in: query
          name: types
          schema:
            type: string
            description: Daftar tipe dipisah koma (ASSIGNMENT,QUIZ,MEETING,EXAM)
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Item kronologi terurut menaik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '400':
          description: Parameter filter tidak valid
        '403':
          description: Admin, atau filter class_id di luar cakupan pengguna

  /meetings/{meetingId}/quizzes:
    post:
      tags: [Quizzes]
      summary: Buat kuis pada pertemuan (FR-025)
      description: |
        Dosen pengampu/Admin membuat kuis draft. Ditolak pada pertemuan ujian
        (UTS/UAS). Kuis baru selalu `is_published: false`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: meetingId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuizRequest'
      responses:
        '201':
          description: Kuis draft berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'
        '400':
          description: Pertemuan ujian, durasi di luar 1-180, atau jendela waktu tidak valid
        '403':
          description: Bukan dosen pengampu/Admin

  /classes/{classId}/quizzes:
    get:
      tags: [Quizzes]
      summary: Daftar kuis pada kelas
      description: |
        Mahasiswa hanya melihat kuis terbit; dosen pengampu/Admin melihat
        seluruhnya termasuk jumlah percobaan.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: classId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Daftar kuis terurut `open_at` menaik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizListResponse'
        '403':
          description: Tidak terdaftar/tidak mengampu kelas
        '404':
          description: Kelas tidak ditemukan

  /quizzes/{id}:
    get:
      tags: [Quizzes]
      summary: Detail kuis beserta butir soal
      description: |
        Mahasiswa hanya melihat kuis terbit dan TANPA kunci jawaban
        (`answer_key`/`is_correct` disaring). Draft tersembunyi (404).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Detail kuis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'
        '403':
          description: Tidak berhak membaca kelas
        '404':
          description: Kuis tidak ditemukan (termasuk draft bagi Mahasiswa)
    put:
      tags: [Quizzes]
      summary: Perbarui kuis (FR-025)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuizRequest'
      responses:
        '200':
          description: Kuis diperbarui dan dicatat audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'
        '400':
          description: Jendela waktu tidak valid
        '403':
          description: Bukan dosen pengampu/Admin
        '404':
          description: Kuis tidak ditemukan
    delete:
      tags: [Quizzes]
      summary: Hapus kuis beserta soal dan percobaan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Kuis dihapus (cascade)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Bukan dosen pengampu/Admin
        '404':
          description: Kuis tidak ditemukan

  /quizzes/{id}/publish:
    patch:
      tags: [Quizzes]
      summary: Terbitkan atau tarik publikasi kuis (FR-025)
      description: |
        Penerbitkan memvalidasi kelengkapan: minimal satu soal, total poin > 0,
        pilihan ganda tepat satu kunci, dan `close_at` di masa depan.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishQuizRequest'
      responses:
        '200':
          description: Status publikasi diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'
        '400':
          description: Kuis belum layak terbit
        '403':
          description: Bukan dosen pengampu/Admin
        '404':
          description: Kuis tidak ditemukan

  /quizzes/{id}/questions:
    post:
      tags: [Quizzes]
      summary: Tambah butir soal (FR-040)
      description: |
        Pilihan ganda wajib tepat satu opsi kunci; esai tidak boleh memiliki
        opsi. Ditolak bila sudah ada percobaan mahasiswa (409).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuizQuestionRequest'
      responses:
        '201':
          description: Butir soal ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'
        '400':
          description: Struktur soal tidak valid
        '403':
          description: Bukan dosen pengampu/Admin
        '404':
          description: Kuis tidak ditemukan
        '409':
          description: Sudah ada percobaan mahasiswa

  /quizzes/{id}/questions/{questionId}:
    put:
      tags: [Quizzes]
      summary: Perbarui butir soal (FR-040)
      description: Bila `options` dikirim, seluruh opsi diganti ulang.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - in: path
          name: questionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuizQuestionRequest'
      responses:
        '200':
          description: Butir soal diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'
        '403':
          description: Bukan dosen pengampu/Admin
        '404':
          description: Kuis atau soal tidak ditemukan
        '409':
          description: Sudah ada percobaan mahasiswa
    delete:
      tags: [Quizzes]
      summary: Hapus butir soal
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - in: path
          name: questionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Butir soal dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Bukan dosen pengampu/Admin
        '404':
          description: Kuis atau soal tidak ditemukan
        '409':
          description: Sudah ada percobaan mahasiswa

  /quizzes/{id}/attempts:
    get:
      tags: [Quizzes]
      summary: Roster hasil kuis (FR-041)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Roster seluruh percobaan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResultRosterResponse'
        '403':
          description: Bukan dosen pengampu/Admin
        '404':
          description: Kuis tidak ditemukan
    post:
      tags: [Quizzes]
      summary: Mulai atau lanjutkan percobaan kuis (FR-040)
      description: |
        Satu percobaan per mahasiswa per kuis. Timer ditegakkan server:
        `deadline_at = min(sekarang + durasi, close_at)`. Mengembalikan 201
        untuk percobaan baru dan 200 untuk kelanjutan.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '201':
          description: Percobaan baru dimulai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptResponse'
        '200':
          description: Melanjutkan percobaan berjalan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptResponse'
        '400':
          description: Kuis belum dibuka atau telah ditutup
        '403':
          description: Tidak terdaftar pada kelas
        '404':
          description: Kuis tidak ditemukan (termasuk draft)
        '409':
          description: Percobaan telah selesai

  /quizzes/{id}/attempts/export:
    get:
      tags: [Quizzes]
      summary: Ekspor roster hasil kuis sebagai CSV (FR-041)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Berkas CSV hasil kuis
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '403':
          description: Bukan dosen pengampu/Admin
        '404':
          description: Kuis tidak ditemukan

  /quiz-attempts/{attemptId}:
    get:
      tags: [Quizzes]
      summary: Detail percobaan kuis
      description: |
        Mahasiswa pemilik mendapat versi tersanitasi; kunci jawaban terlihat
        hanya setelah submission. Dosen pengampu/Admin mendapat akses penuh.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: attemptId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detail percobaan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptResponse'
        '403':
          description: Bukan pemilik percobaan / bukan pengampu
        '404':
          description: Percobaan tidak ditemukan

  /quiz-attempts/{attemptId}/answers:
    put:
      tags: [Quizzes]
      summary: Simpan jawaban parsial (FR-040)
      description: |
        Auto-submit lazy: bila deadline terlewat, percobaan dikumpulkan
        otomatis dengan `submitted_at = deadline_at` dan permintaan ditolak.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: attemptId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveQuizAnswersRequest'
      responses:
        '200':
          description: Jawaban tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptResponse'
        '400':
          description: Soal/opsi tidak valid atau waktu telah berakhir
        '403':
          description: Bukan pemilik percobaan
        '404':
          description: Percobaan tidak ditemukan
        '409':
          description: Percobaan telah selesai

  /quiz-attempts/{attemptId}/submit:
    post:
      tags: [Quizzes]
      summary: Kumpulkan percobaan kuis (FR-040)
      description: |
        Pilihan ganda dinilai otomatis (0-100, 2 desimal). Status SUBMITTED
        bila masih ada esai, GRADED bila seluruhnya objektif.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: attemptId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Percobaan dikumpulkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptResponse'
        '403':
          description: Bukan pemilik percobaan
        '404':
          description: Percobaan tidak ditemukan
        '409':
          description: Percobaan telah selesai

  /quiz-attempts/{attemptId}/grade:
    put:
      tags: [Quizzes]
      summary: Nilai jawaban esai (FR-041)
      description: |
        Hanya jawaban esai yang dapat dinilai manual. Skor akhir dihitung ulang
        penuh dari poin seluruh jawaban; status GRADED bila seluruh esai telah
        dinilai.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: attemptId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeQuizAttemptRequest'
      responses:
        '200':
          description: Penilaian tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizGradeResultResponse'
        '400':
          description: Bukan esai, poin di luar rentang, atau percobaan masih berjalan
        '403':
          description: Bukan dosen pengampu/Admin
        '404':
          description: Percobaan tidak ditemukan

  /notifications:
    get:
      tags: [Notifications]
      summary: Daftar notifikasi pengguna (FR-057)
      description: |
        Mematerialisasi pengingat deadline H-1 secara lazy. Mendukung filter
        `is_read` dan `type` serta paginasi.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: is_read
          schema: { type: string, enum: ['true', 'false'] }
        - in: query
          name: type
          schema:
            type: string
            enum: [ASSIGNMENT_CREATED, DEADLINE_REMINDER, ATTENDANCE_OPENED, ATTENDANCE_UPDATED, GRADE_PUBLISHED, ENROLLMENT_CREATED, QUIZ_PUBLISHED]
      responses:
        '200':
          description: Daftar notifikasi terurut terbaru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '400':
          description: Parameter filter tidak valid
        '401':
          description: Tidak terautentikasi

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Jumlah notifikasi belum dibaca (FR-057)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Jumlah belum dibaca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
        '401':
          description: Tidak terautentikasi

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Tandai seluruh notifikasi dibaca (FR-057)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Jumlah notifikasi ditandai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Tidak terautentikasi

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Tandai satu notifikasi dibaca (FR-057)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Notifikasi ditandai dibaca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Notifikasi tidak ditemukan atau bukan milik pengguna
