openapi: 3.0.3
info:
  title: SPADA LMS Backend API
  version: 1.0.0
  description: API MVP 1 untuk sistem pembelajaran daring SPADA LMS.
servers:
  - url: http://localhost:5000/api
tags:
  - name: Auth
  - name: Profile
  - name: Users
  - name: Courses
  - name: Classes
  - name: Enrollments
  - name: Dashboard
  - name: Audit Logs
components:
  parameters:
    EntityId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
        password:
          type: string
          format: password
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, dosen, mahasiswa]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login multi-kredensial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil dan access token diterbitkan
        '401':
          description: Kredensial salah atau akun tidak aktif
  /auth/refresh:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200': { description: Access token diperbarui }
  /auth/logout:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200': { description: Sesi dicabut }
  /profile:
    get:
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        '200': { description: Profil pengguna }
    put:
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        '200': { description: Profil diperbarui }
  /profile/avatar:
    post:
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        '200': { description: Avatar diunggah }
  /admin/users:
    get:
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: role
          schema: { type: string, enum: [admin, dosen, mahasiswa] }
        - in: query
          name: status
          schema: { type: string, enum: [ACTIVE, INACTIVE, SUSPENDED] }
      responses:
        '200': { description: Daftar pengguna }
    post:
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '201': { description: Pengguna dibuat }
  /admin/users/{id}/status:
    patch:
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Status pengguna diperbarui }
  /admin/users/{id}/reset-password:
    put:
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Kata sandi pengguna direset }
  /admin/courses:
    get:
      tags: [Courses]
      security:
        - bearerAuth: []
      responses:
        '200': { description: Daftar mata kuliah }
    post:
      tags: [Courses]
      security:
        - bearerAuth: []
      responses:
        '201': { description: Mata kuliah dibuat }
  /admin/courses/{id}:
    get:
      tags: [Courses]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200': { description: Detail mata kuliah }
    put:
      tags: [Courses]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200': { description: Mata kuliah diperbarui }
    delete:
      tags: [Courses]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200': { description: Mata kuliah dinonaktifkan }
  /admin/classes:
    get:
      tags: [Classes]
      security:
        - bearerAuth: []
      responses:
        '200': { description: Daftar kelas }
    post:
      tags: [Classes]
      security:
        - bearerAuth: []
      responses:
        '201': { description: Kelas dibuka }
  /admin/classes/{id}:
    get:
      tags: [Classes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200': { description: Detail kelas }
    put:
      tags: [Classes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200': { description: Kelas diperbarui }
    delete:
      tags: [Classes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200': { description: Kelas dihapus jika belum memiliki enrollment }
  /admin/enrollments:
    post:
      tags: [Enrollments]
      security:
        - bearerAuth: []
      responses:
        '201': { description: Enrollment individual atau batch berhasil dibuat }
  /admin/enrollments/{id}:
    delete:
      tags: [Enrollments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200': { description: Mahasiswa dicabut dari kelas }
  /dashboard:
    get:
      tags: [Dashboard]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard sesuai role pengguna
  /classes:
    get:
      tags: [Classes]
      security:
        - bearerAuth: []
      responses:
        '200': { description: Daftar kelas pengguna }
  /classes/{id}:
    get:
      tags: [Classes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200': { description: Detail ruang kelas }
  /admin/audit-logs:
    get:
      tags: [Audit Logs]
      security:
        - bearerAuth: []
      responses:
        '200': { description: Daftar jejak audit }
