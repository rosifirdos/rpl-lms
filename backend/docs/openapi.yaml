openapi: '3.0.3'
info:
  title: Sistem Akademik Kampus Terintegrasi - Backend API
  description: |
    **API Backend MVP 1** untuk Sistem Akademik Kampus Terintegrasi (Portal, SIA, SPADA/LMS, PMB).

    Dibangun berdasarkan spesifikasi [SRS.md](../SRS.md) — mencakup Bab 3, 5, 9, 10, 11, 14, 15, 19, 28, 31, 32, 34, 35, dan 39.

    ## Cakupan MVP 1
    - Autentikasi multi-kredensial & manajemen sesi JWT
    - Otorisasi berbasis 8 role aktor (RBAC)
    - Manajemen profil mandiri
    - Dasbor portal kontekstual per role
    - Master data kelembagaan, akademik, fasilitas & kalender
    - Manajemen pengguna & hak akses
    - Jejak audit (Audit Trail)

    ## Autentikasi
    Menggunakan **Bearer Token (JWT)**. Kirim header `Authorization: Bearer <accessToken>` pada setiap endpoint yang memerlukan autentikasi.

    ## Standar Respons
    Semua respons mengikuti format:
    ```json
    {
      "success": true|false,
      "message": "Deskripsi hasil operasi",
      "data": { ... },
      "meta": { "page": 1, "limit": 10, "total": 100, "totalPages": 10 }
    }
    ```

    ## Endpoint Alias Konseptual (SRS Bab 32)
    | Alias | Redirect Ke |
    |---|---|
    | `POST /api/login` | `POST /api/v1/auth/login` |
    | `POST /api/logout` | `POST /api/v1/auth/logout` |
    | `GET /api/profile` | `GET /api/v1/profile` |
    | `GET /api/calendar` | `GET /api/v1/calendar` |
    | `GET /api/dashboard` | `GET /api/v1/portal/dashboard` |
    | `GET /api/portal/modules` | `GET /api/v1/portal/modules` |
  version: 1.0.0
  contact:
    name: Tim Pengembang RPL-LMS
  license:
    name: MIT

servers:
  - url: http://localhost:5000
    description: Server Pengembangan Lokal

tags:
  - name: Health
    description: Status operasional API
  - name: Auth
    description: Autentikasi, sesi, dan keamanan akun (SRS Bab 14 & 15)
  - name: Profile
    description: Manajemen profil mandiri (SRS Bab 31 & 32)
  - name: Portal
    description: Dasbor portal & launcher modul (SRS Bab 9 & 19)
  - name: Users
    description: Manajemen pengguna & hak akses (SRS Bab 31)
  - name: Calendar
    description: Kalender akademik (SRS Bab 22)
  - name: Master - Kelembagaan
    description: Fakultas & Program Studi (SRS Bab 10)
  - name: Master - Waktu
    description: Tahun Akademik & Semester (SRS Bab 10 & 22)
  - name: Master - Akademik
    description: Kurikulum, Mata Kuliah & Kelas (SRS Bab 10 & 28.2)
  - name: Master - Fasilitas
    description: Gedung & Ruangan (SRS Bab 10)
  - name: Audit Log
    description: Jejak audit sistem (SRS Bab 35)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access Token JWT (masa berlaku 15 menit)

  schemas:
    # ── Standar Respons ──
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 50
        totalPages:
          type: integer
          example: 5

    # ── Auth ──
    LoginRequest:
      type: object
      required:
        - password
      properties:
        identifier:
          type: string
          description: Username, NIM, NIDN, NIP, No. Pendaftaran, atau email
          example: superadmin
        username:
          type: string
          description: Alias untuk identifier
        email:
          type: string
          format: email
          description: Alias untuk identifier
        password:
          type: string
          format: password
          example: Password123!

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login berhasil
        data:
          type: object
          properties:
            accessToken:
              type: string
              description: JWT Access Token (15 menit)
            refreshToken:
              type: string
              description: JWT Refresh Token (7 hari)
            user:
              $ref: '#/components/schemas/UserSummary'

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'
        permissions:
          type: array
          items:
            type: string
          example: ['profile:read', 'profile:update', 'portal:view']
        profile:
          $ref: '#/components/schemas/UserProfile'

    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED]

    RoleName:
      type: string
      enum: [SUPER_ADMIN, ADMIN_AKADEMIK, ADMIN_LMS, DOSEN, DOSEN_WALI, MAHASISWA, CALON_MAHASISWA, USER_UMUM]

    UserProfile:
      type: object
      description: Profil entitas spesifik berdasarkan role
      properties:
        type:
          type: string
          enum: [MAHASISWA, DOSEN, ADMIN, CALON_MAHASISWA]
        nim:
          type: string
        nidn:
          type: string
        nip:
          type: string
        nama:
          type: string
        no_pendaftaran:
          type: string
        status_akademik:
          type: string
          enum: [AKTIF, CUTI, LULUS, DROP_OUT]
        prodi:
          type: object
          properties:
            id:
              type: string
            kode:
              type: string
            nama:
              type: string
            jenjang:
              type: string
            fakultas:
              type: object
              properties:
                id:
                  type: string
                kode:
                  type: string
                nama:
                  type: string

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    ChangePasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
        - confirmPassword
      properties:
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
        confirmPassword:
          type: string
          format: password

    ForgotPasswordRequest:
      type: object
      properties:
        identifier:
          type: string
        email:
          type: string
          format: email

    # ── Portal ──
    PortalModule:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
          example: SIA
        name:
          type: string
          example: Sistem Informasi Akademik
        description:
          type: string
        icon:
          type: string
        url:
          type: string
        allowed_roles:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            type: string
        is_accessible:
          type: boolean
        badge:
          type: string
          nullable: true

    DashboardResponse:
      type: object
      properties:
        system_context:
          type: object
          properties:
            tahun_akademik:
              type: object
            semester_aktif:
              type: object
            agenda_aktif:
              type: array
              items:
                type: object
            agenda_mendatang:
              type: array
              items:
                type: object
        user:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            email:
              type: string
            roles:
              type: array
              items:
                type: string
        role_dashboards:
          type: object
          description: Dashboard spesifik per role (mahasiswa, dosen, admin_akademik, admin_lms, super_admin, calon_mahasiswa)

    # ── Calendar ──
    KalenderAkademik:
      type: object
      properties:
        id:
          type: string
          format: uuid
        semester_id:
          type: string
          format: uuid
        agenda:
          type: string
          example: Periode KRS
        mulai:
          type: string
          format: date-time
        selesai:
          type: string
          format: date-time
        status:
          type: string
          enum: [DIJADWALKAN, BERJALAN, SELESAI]
        created_at:
          type: string
          format: date-time
        semester:
          type: object
          properties:
            id:
              type: string
            tipe:
              type: string
            tahun_akademik:
              type: object

    CreateCalendarRequest:
      type: object
      required:
        - semester_id
        - agenda
        - mulai
        - selesai
      properties:
        semester_id:
          type: string
          format: uuid
        agenda:
          type: string
          minLength: 3
          maxLength: 200
        mulai:
          type: string
          format: date-time
        selesai:
          type: string
          format: date-time
        status:
          type: string
          enum: [DIJADWALKAN, BERJALAN, SELESAI]
          default: DIJADWALKAN

    UpdateCalendarRequest:
      type: object
      properties:
        agenda:
          type: string
        mulai:
          type: string
          format: date-time
        selesai:
          type: string
          format: date-time
        status:
          type: string
          enum: [DIJADWALKAN, BERJALAN, SELESAI]

    # ── Master Kelembagaan ──
    Fakultas:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kode:
          type: string
          example: FILKOM
        nama:
          type: string
          example: Fakultas Ilmu Komputer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        _count:
          type: object
          properties:
            program_studi:
              type: integer

    CreateFakultasRequest:
      type: object
      required:
        - kode
        - nama
      properties:
        kode:
          type: string
          minLength: 2
          maxLength: 20
        nama:
          type: string
          minLength: 2
          maxLength: 100
        is_active:
          type: boolean
          default: true

    ProgramStudi:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fakultas_id:
          type: string
          format: uuid
        kode:
          type: string
          example: TIF
        nama:
          type: string
          example: Teknik Informatika
        jenjang:
          type: string
          enum: [D3, S1, S2]
        is_active:
          type: boolean
        fakultas:
          $ref: '#/components/schemas/Fakultas'

    CreateProdiRequest:
      type: object
      required:
        - fakultas_id
        - kode
        - nama
      properties:
        fakultas_id:
          type: string
          format: uuid
        kode:
          type: string
          minLength: 2
          maxLength: 20
        nama:
          type: string
          minLength: 2
          maxLength: 100
        jenjang:
          type: string
          enum: [D3, S1, S2]
          default: S1
        is_active:
          type: boolean
          default: true

    # ── Master Waktu ──
    TahunAkademik:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kode:
          type: string
          example: '2026/2027'
        nama:
          type: string
          example: Tahun Ajaran 2026/2027
        is_active:
          type: boolean
        semester:
          type: array
          items:
            $ref: '#/components/schemas/Semester'

    CreateTahunAkademikRequest:
      type: object
      required:
        - kode
        - nama
      properties:
        kode:
          type: string
          minLength: 4
          maxLength: 20
        nama:
          type: string
          minLength: 3
          maxLength: 100
        is_active:
          type: boolean
          default: true

    Semester:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tahun_akademik_id:
          type: string
          format: uuid
        tipe:
          type: string
          enum: [GANJIL, GENAP, ANTARA]
        tanggal_mulai:
          type: string
          format: date-time
        tanggal_selesai:
          type: string
          format: date-time
        is_active:
          type: boolean
        tahun_akademik:
          $ref: '#/components/schemas/TahunAkademik'

    CreateSemesterRequest:
      type: object
      required:
        - tahun_akademik_id
        - tipe
        - tanggal_mulai
        - tanggal_selesai
      properties:
        tahun_akademik_id:
          type: string
          format: uuid
        tipe:
          type: string
          enum: [GANJIL, GENAP, ANTARA]
        tanggal_mulai:
          type: string
          format: date-time
        tanggal_selesai:
          type: string
          format: date-time
        is_active:
          type: boolean
          default: false

    # ── Master Akademik ──
    Kurikulum:
      type: object
      properties:
        id:
          type: string
          format: uuid
        prodi_id:
          type: string
          format: uuid
        nama:
          type: string
          example: Kurikulum Merdeka TIF 2024
        tahun_mulai:
          type: integer
          example: 2024
        is_active:
          type: boolean
        prodi:
          $ref: '#/components/schemas/ProgramStudi'

    CreateKurikulumRequest:
      type: object
      required:
        - prodi_id
        - nama
        - tahun_mulai
      properties:
        prodi_id:
          type: string
          format: uuid
        nama:
          type: string
          minLength: 3
          maxLength: 100
        tahun_mulai:
          type: integer
          minimum: 1900
          maximum: 2100
        is_active:
          type: boolean
          default: true

    MataKuliah:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kurikulum_id:
          type: string
          format: uuid
        kode:
          type: string
          example: TIF-201
        nama:
          type: string
          example: Rekayasa Perangkat Lunak
        sks:
          type: integer
          example: 3
        sks_teori:
          type: integer
        sks_praktik:
          type: integer
        semester_paket:
          type: integer
          example: 3
        is_wajib:
          type: boolean
        is_active:
          type: boolean

    CreateMataKuliahRequest:
      type: object
      required:
        - kurikulum_id
        - kode
        - nama
        - sks
      properties:
        kurikulum_id:
          type: string
          format: uuid
        kode:
          type: string
          minLength: 2
          maxLength: 30
        nama:
          type: string
          minLength: 2
          maxLength: 150
        sks:
          type: integer
          minimum: 1
          maximum: 12
        sks_teori:
          type: integer
          default: 0
        sks_praktik:
          type: integer
          default: 0
        semester_paket:
          type: integer
          minimum: 1
          maximum: 14
          default: 1
        is_wajib:
          type: boolean
          default: true
        is_active:
          type: boolean
          default: true

    Kelas:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mata_kuliah_id:
          type: string
          format: uuid
        semester_id:
          type: string
          format: uuid
        dosen_id:
          type: string
          format: uuid
        ruangan_id:
          type: string
          format: uuid
          nullable: true
        kode_kelas:
          type: string
          example: TI-3A
        kapasitas:
          type: integer
          example: 40
        mata_kuliah:
          $ref: '#/components/schemas/MataKuliah'
        semester:
          $ref: '#/components/schemas/Semester'
        dosen:
          type: object
        ruangan:
          type: object
          nullable: true

    CreateKelasRequest:
      type: object
      required:
        - mata_kuliah_id
        - semester_id
        - dosen_id
        - kode_kelas
      properties:
        mata_kuliah_id:
          type: string
          format: uuid
        semester_id:
          type: string
          format: uuid
        dosen_id:
          type: string
          format: uuid
        ruangan_id:
          type: string
          format: uuid
          nullable: true
        kode_kelas:
          type: string
          minLength: 1
          maxLength: 20
        kapasitas:
          type: integer
          minimum: 1
          maximum: 500
          default: 40

    # ── Master Fasilitas ──
    Gedung:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kode:
          type: string
          example: G-F
        nama:
          type: string
          example: Gedung F Ilmu Komputer
        created_at:
          type: string
          format: date-time
        _count:
          type: object
          properties:
            ruangan:
              type: integer

    CreateGedungRequest:
      type: object
      required:
        - kode
        - nama
      properties:
        kode:
          type: string
          minLength: 1
          maxLength: 20
        nama:
          type: string
          minLength: 2
          maxLength: 100

    Ruangan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gedung_id:
          type: string
          format: uuid
        kode:
          type: string
          example: RT-F101
        nama:
          type: string
          example: Ruang Teori F-101
        kapasitas:
          type: integer
          example: 50
        is_active:
          type: boolean
        gedung:
          $ref: '#/components/schemas/Gedung'

    CreateRuanganRequest:
      type: object
      required:
        - gedung_id
        - kode
        - nama
        - kapasitas
      properties:
        gedung_id:
          type: string
          format: uuid
        kode:
          type: string
          minLength: 1
          maxLength: 30
        nama:
          type: string
          minLength: 2
          maxLength: 100
        kapasitas:
          type: integer
          minimum: 1
          maximum: 1000
        is_active:
          type: boolean
          default: true

    # ── Users ──
    UpdateUserRolesRequest:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'
          minItems: 1

    UpdateUserStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'
        reason:
          type: string
          description: Alasan perubahan status (opsional)

    # ── Audit Log ──
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          example: LOGIN
        entity:
          type: string
          example: users
        entity_id:
          type: string
          nullable: true
        old_values:
          type: object
          nullable: true
        new_values:
          type: object
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        waktu:
          type: string
          format: date-time
        user:
          type: object
          nullable: true
          properties:
            id:
              type: string
            username:
              type: string

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    SearchParam:
      name: search
      in: query
      schema:
        type: string
      description: Pencarian teks pada field nama/kode
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Token JWT tidak valid atau tidak disertakan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Akses ditolak. Token tidak valid atau tidak ditemukan.
    Forbidden:
      description: Tidak memiliki hak akses untuk operasi ini
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Akses ditolak. Anda tidak memiliki izin yang diperlukan.
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Data tidak ditemukan
    Conflict:
      description: Konflik duplikasi data (unique constraint)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Data dengan kode tersebut sudah ada
    ValidationError:
      description: Validasi input gagal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

# ================================================================
# PATHS
# ================================================================
paths:
  # ── Health ──
  /health:
    get:
      tags: [Health]
      summary: Cek status operasional API
      operationId: healthCheck
      responses:
        '200':
          description: API aktif dan berjalan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      env:
                        type: string

  /api/v1:
    get:
      tags: [Health]
      summary: Katalog endpoint API v1
      operationId: apiCatalog
      responses:
        '200':
          description: Daftar endpoint yang tersedia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ── Auth ──
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login (autentikasi multi-kredensial)
      description: |
        Autentikasi menggunakan `username`, `email`, NIM, NIDN, NIP, atau No. Pendaftaran.
        Mengembalikan JWT Access Token (15 menit) dan Refresh Token (7 hari).

        **Alias SRS:** `POST /api/login`
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              superadmin:
                summary: Login Super Admin
                value:
                  identifier: superadmin
                  password: Password123!
              mahasiswa:
                summary: Login Mahasiswa (NIM)
                value:
                  identifier: '2024001001'
                  password: Password123!
              dosen:
                summary: Login Dosen (NIDN)
                value:
                  identifier: '198501152010121002'
                  password: Password123!
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Akun tidak aktif atau ditangguhkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

