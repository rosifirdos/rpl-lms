openapi: 3.0.3
info:
  title: E-Learning Kampus Backend API
  version: 1.4.1
  description: Dokumentasi resmi API MVP 1, MVP 2, dan MVP 3 untuk sistem pembelajaran daring E-Learning Kampus.
servers:
  - url: http://localhost:5000/api
    description: Server Lokal Pengembangan
tags:
  - name: Auth
    description: Autentikasi multi-kredensial dan manajemen sesi JWT
  - name: Profile
    description: Manajemen profil mandiri dan foto avatar
  - name: Users
    description: Manajemen akun pengguna 3 peran (Admin)
  - name: Courses
    description: Master katalog mata kuliah (Admin)
  - name: Classes
    description: Pembukaan dan pengelolaan kelas perkuliahan
  - name: Enrollments
    description: Modul direct enrollment kepesertaan mahasiswa (Admin)
  - name: Dashboard
    description: Dasbor kontekstual mahasiswa, dosen, dan admin
  - name: Audit Logs
    description: Peninjau jejak audit mutasi sistem (Admin)
  - name: Meetings
    description: Pertemuan terstruktur MVP 2
  - name: Materials
    description: Distribusi materi pembelajaran terproteksi
  - name: Attendance
    description: Sesi presensi, check-in, dan rekapitulasi MVP 2
  - name: Assignments
    description: Penerbitan dan pengelolaan tugas perkuliahan MVP 3
  - name: Submissions
    description: Pengumpulan jawaban mahasiswa dan penilaian skor 0â€“100 MVP 3

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EntityId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    PageQuery:
      in: query
      name: page
      required: false
      schema:
        type: integer
        default: 1
    LimitQuery:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        default: 20
    SearchQuery:
      in: query
      name: search
      required: false
      schema:
        type: string

  schemas:
    ApiResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operasi berhasil
        code:
          type: string
          example: CONCURRENCY_CONFLICT
        data:
          type: object
          nullable: true
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 45
        totalPages:
          type: integer
          example: 3

    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Username, NIM, NIDN, NIP, atau Email terdaftar
          example: admin
        password:
          type: string
          format: password
          example: password123

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: mahasiswa@kampus.ac.id

    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          example: Budi Santoso
        phone:
          type: string
          example: '08123456789'
        bio:
          type: string
          example: Dosen Teknik Informatika

    ChangePasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password

    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - password
        - role
        - full_name
      properties:
        username:
          type: string
          example: 2024001099
        email:
          type: string
          format: email
          example: mhs.baru@kampus.ac.id
        password:
          type: string
          format: password
          example: password123
        role:
          type: string
          enum: [admin, dosen, mahasiswa]
        full_name:
          type: string
          example: Fajar Nugraha
        nim:
          type: string
          example: '2024001099'
        nidn:
          type: string
          example: '0612345609'
        nip:
          type: string
          example: '198501152010121099'
        prodi:
          type: string
          example: Teknik Informatika
        angkatan:
          type: integer
          example: 2024
        gelar_depan:
          type: string
          example: Dr.
        gelar_belakang:
          type: string
          example: M.Kom.

    UpdateUserStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]

    ResetPasswordRequest:
      type: object
      required:
        - newPassword
      properties:
        newPassword:
          type: string
          format: password
          example: BaruPassword123!

    CreateCourseRequest:
      type: object
      required:
        - code
        - name
        - credits
      properties:
        code:
          type: string
          example: TIF106
        name:
          type: string
          example: Arsitektur Perangkat Lunak
        credits:
          type: integer
          minimum: 1
          maximum: 6
          example: 3
        description:
          type: string
          example: Mata kuliah perancangan pola arsitektur software.

    UpdateCourseRequest:
      type: object
      properties:
        name:
          type: string
        credits:
          type: integer
          minimum: 1
          maximum: 6
        description:
          type: string
        is_active:
          type: boolean

    CreateClassRequest:
      type: object
      required:
        - course_id
        - lecturer_id
        - academic_year
        - semester
        - name
        - capacity
      properties:
        course_id:
          type: string
          format: uuid
        lecturer_id:
          type: string
          format: uuid
        academic_year:
          type: string
          pattern: '^\d{4}/\d{4}$'
          example: 2026/2027
        semester:
          type: string
          enum: [ganjil, genap]
        name:
          type: string
          example: TI-C
        capacity:
          type: integer
          minimum: 1
          example: 40

    UpdateClassRequest:
      type: object
      properties:
        course_id:
          type: string
          format: uuid
        lecturer_id:
          type: string
          format: uuid
        academic_year:
          type: string
        semester:
          type: string
          enum: [ganjil, genap]
        name:
          type: string
        capacity:
          type: integer

    CreateEnrollmentRequest:
      type: object
      required:
        - class_id
      properties:
        class_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
          description: Digunakan untuk pendaftaran tunggal
        student_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Digunakan untuk pendaftaran batch

    UpdateMeetingRequest:
      type: object
      description: |
        Minimal satu properti wajib diisi; body kosong ditolak dengan 400.
        Kolom di luar daftar ini ditolak (skema strict).
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
          description: Judul/topik pertemuan
        description:
          type: string
          nullable: true
          maxLength: 2000
          description: Deskripsi pertemuan
        is_published:
          type: boolean
          description: Status publikasi pertemuan bagi mahasiswa
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Jadwal pelaksanaan pertemuan/ujian (ISO 8601 dengan offset zona
            waktu). Menjadi sumber `starts_at` item `MEETING`/`EXAM` pada
            timeline terpusat (FR-011, BR-013).

    CreateMaterialRequest:
      type: object
      required: [title, file]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 5000
        file:
          type: string
          format: binary

    UpdateMaterialRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          nullable: true
          maxLength: 5000

    OpenAttendanceSessionRequest:
      type: object
      additionalProperties: false
      properties:
        tolerance_minutes:
          type: integer
          minimum: 1
          maximum: 180
          default: 15
          description: |
            Batas durasi sesi (default 15 menit). Auto-close bersifat lazy, bukan
            timer latar: sesi ditutup saat ada check-in atau permintaan daftar
            kehadiran setelah batas ini terlewati.

    UpdateAttendanceRecordRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [HADIR, SAKIT, IZIN, ALPA]
        notes:
          type: string
          nullable: true
          maxLength: 1000

    AttendanceSessionData:
      type: object
      required: [id, meeting_id, status, opened_at, closed_at, tolerance_minutes]
      properties:
        id:
          type: string
          format: uuid
        meeting_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [OPEN, CLOSED]
        opened_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        tolerance_minutes:
          type: integer
          minimum: 1
          maximum: 180
        meeting:
          type: object
          properties:
            id:
              type: string
              format: uuid
            meeting_number:
              type: integer
              minimum: 1
              maximum: 16
            title:
              type: string

    AttendanceRecordData:
      type: object
      required: [id, student_id, nim, full_name, status, recorded_at, notes]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: |
            `null` pada daftar roster berarti mahasiswa belum mencatat kehadiran;
            respons check-in dan koreksi selalu mengembalikan UUID.
        student_id:
          type: string
          format: uuid
        nim:
          type: string
        full_name:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
          enum: [HADIR, SAKIT, IZIN, ALPA]
        recorded_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        session:
          type: object
          properties:
            id:
              type: string
              format: uuid
            meeting_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [OPEN, CLOSED]

    AttendanceSessionRecordsData:
      type: object
      required: [session, summary, records]
      properties:
        session:
          $ref: '#/components/schemas/AttendanceSessionData'
        summary:
          type: object
          required: [total_students, recorded_count, hadir, sakit, izin, alpa, not_recorded]
          properties:
            total_students:
              type: integer
            recorded_count:
              type: integer
            hadir:
              type: integer
            sakit:
              type: integer
            izin:
              type: integer
            alpa:
              type: integer
            not_recorded:
              type: integer
        records:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecordData'

    AttendanceRecapMatrixEntry:
      type: object
      required: [meeting_number, status]
      properties:
        meeting_number:
          type: integer
          minimum: 1
          maximum: 16
        status:
          type: string
          nullable: true
          enum: [HADIR, SAKIT, IZIN, ALPA]

    AttendanceRecapStudent:
      type: object
      required: [student_id, nim, full_name, total_hadir, percentage, matrix]
      properties:
        student_id:
          type: string
          format: uuid
        nim:
          type: string
        full_name:
          type: string
          nullable: true
        total_hadir:
          type: integer
          minimum: 0
        percentage:
          type: number
          minimum: 0
          maximum: 100
          description: Persentase kehadiran berdasarkan jumlah sesi presensi yang pernah dibuka.
        matrix:
          type: array
          minItems: 16
          maxItems: 16
          items:
            $ref: '#/components/schemas/AttendanceRecapMatrixEntry'

    AttendanceRecapData:
      type: object
      required: [total_sessions, total_meetings, recap]
      properties:
        total_sessions:
          type: integer
          minimum: 0
          description: Jumlah sesi presensi yang pernah dibuka pada kelas.
        total_meetings:
          type: integer
          minimum: 0
          maximum: 16
        recap:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecapStudent'

    AttendanceSessionResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AttendanceSessionData'

    AttendanceRecordResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AttendanceRecordData'

    AttendanceSessionRecordsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AttendanceSessionRecordsData'

    AttendanceRecapResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AttendanceRecapData'

    Meeting:
      type: object
      properties:
        id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        meeting_number:
          type: integer
          minimum: 1
          maximum: 16
        title:
          type: string
        description:
          type: string
          nullable: true
        is_exam:
          type: boolean
        exam_type:
          type: string
          enum: [NONE, UTS, UAS]
        is_published:
          type: boolean
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Jadwal pelaksanaan pertemuan/ujian (ISO 8601 dengan offset zona
            waktu); `starts_at` item `MEETING`/`EXAM` pada timeline (FR-011).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AssignmentSoal:
      type: object
      required: [id, original_name, size_bytes, mime_type]
      properties:
        id:
          type: string
          format: uuid
        original_name:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        mime_type:
          type: string

    AssignmentMySubmission:
      type: object
      description: |
        Ringkasan submission milik mahasiswa yang sedang login. Status diturunkan
        dari data tersimpan: `score != null` â†’ `GRADED`, `is_late` â†’ `LATE`,
        selain itu `SUBMITTED`.
      required: [id, status, submitted_at, is_late, score, feedback]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [SUBMITTED, LATE, GRADED]
        submitted_at:
          type: string
          format: date-time
        is_late:
          type: boolean
        score:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: Skor numerik 0â€“100 dengan maksimal 2 desimal (null bila belum dinilai).
        feedback:
          type: string
          nullable: true

    Assignment:
      type: object
      required:
        - id
        - meeting_id
        - meeting_number
        - title
        - weight_percentage
        - due_date
        - allow_late
        - is_published
        - soal
      properties:
        id:
          type: string
          format: uuid
        meeting_id:
          type: string
          format: uuid
        meeting_number:
          type: integer
          minimum: 1
          maximum: 16
        title:
          type: string
          maxLength: 150
        instructions:
          type: string
          nullable: true
        weight_percentage:
          type: number
          minimum: 0
          maximum: 100
          description: Bobot penilaian tugas (0â€“100).
        due_date:
          type: string
          format: date-time
          description: Deadline berbasis waktu server (ISO 8601; offset zona waktu diterima, disimpan sebagai UTC).
        allow_late:
          type: boolean
        is_published:
          type: boolean
          description: Tugas non-publikasi tidak terlihat oleh mahasiswa (BR-005).
        soal:
          allOf:
            - $ref: '#/components/schemas/AssignmentSoal'
          nullable: true

    AssignmentListEntry:
      allOf:
        - $ref: '#/components/schemas/Assignment'
        - type: object
          properties:
            my_submission:
              allOf:
                - $ref: '#/components/schemas/AssignmentMySubmission'
              nullable: true
              description: Hanya diisi untuk mahasiswa.
            _count:
              type: object
              description: Hanya diisi untuk dosen pengampu/Admin.
              properties:
                submissions:
                  type: integer
                  minimum: 0

    AssignmentRosterSummary:
      type: object
      required: [total_students, submitted, late, graded, not_submitted]
      properties:
        total_students:
          type: integer
          minimum: 0
        submitted:
          type: integer
          minimum: 0
        late:
          type: integer
          minimum: 0
        graded:
          type: integer
          minimum: 0
        not_submitted:
          type: integer
          minimum: 0

    AssignmentDetail:
      allOf:
        - $ref: '#/components/schemas/Assignment'
        - type: object
          properties:
            my_submission:
              allOf:
                - $ref: '#/components/schemas/AssignmentMySubmission'
              nullable: true
              description: Hanya diisi untuk mahasiswa.
            roster_summary:
              $ref: '#/components/schemas/AssignmentRosterSummary'

    Submission:
      type: object
      required:
        - id
        - assignment_id
        - student_id
        - status
        - submitted_at
        - is_late
        - score
        - feedback
        - graded_at
      properties:
        id:
          type: string
          format: uuid
        assignment_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [SUBMITTED, LATE, GRADED]
        submitted_at:
          type: string
          format: date-time
          description: Stempel waktu server saat berkas jawaban diterima.
        is_late:
          type: boolean
        score:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
        feedback:
          type: string
          nullable: true
        graded_at:
          type: string
          format: date-time
          nullable: true

    SubmissionRosterEntry:
      type: object
      required:
        - student_id
        - nim
        - full_name
        - submission_id
        - submitted_at
        - is_late
        - score
        - feedback
        - status
        - download_url
      properties:
        student_id:
          type: string
          format: uuid
        nim:
          type: string
        full_name:
          type: string
          nullable: true
        submission_id:
          type: string
          format: uuid
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        is_late:
          type: boolean
        score:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
        feedback:
          type: string
          nullable: true
        status:
          type: string
          enum: [NOT_SUBMITTED, SUBMITTED, LATE, GRADED]
        download_url:
          type: string
          nullable: true

    SubmissionRoster:
      type: object
      required: [total_students, submitted, late, graded, not_submitted, roster]
      properties:
        total_students:
          type: integer
          minimum: 0
        submitted:
          type: integer
          minimum: 0
        late:
          type: integer
          minimum: 0
        graded:
          type: integer
          minimum: 0
        not_submitted:
          type: integer
          minimum: 0
        roster:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionRosterEntry'

    CreateAssignmentRequest:
      type: object
      required: [title, weight_percentage, due_date]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        instructions:
          type: string
          nullable: true
          maxLength: 5000
        weight_percentage:
          type: number
          minimum: 0
          maximum: 100
          description: Bobot penilaian tugas (maksimal 2 desimal).
        due_date:
          type: string
          format: date-time
          description: Wajib berada di masa depan saat tugas dibuat. Menerima ISO 8601 dengan zona waktu (mis. 2026-12-01T23:59:00+07:00).
        allow_late:
          type: boolean
          default: false
        is_published:
          type: boolean
          default: true
        file:
          type: string
          format: binary
          description: Berkas soal opsional (.pdf, .docx, .xlsx, .zip; maks 10MB).

    UpdateAssignmentRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        instructions:
          type: string
          nullable: true
          maxLength: 5000
        weight_percentage:
          type: number
          minimum: 0
          maximum: 100
          description: Bobot penilaian tugas (0â€“100, maksimal 2 desimal).
        due_date:
          type: string
          format: date-time
          description: Wajib berada di masa depan. Menerima ISO 8601 dengan zona waktu.
        allow_late:
          type: boolean
        is_published:
          type: boolean
        file:
          type: string
          format: binary
          description: Berkas soal pengganti (opsional).

    UploadSubmissionRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Berkas jawaban (.pdf, .docx, .xlsx, .zip; maks 5â€“10MB).

    GradeSubmissionRequest:
      type: object
      required: [score]
      properties:
        score:
          type: number
          minimum: 0
          maximum: 100
          description: Skor numerik 0â€“100 dengan maksimal 2 digit desimal.
        feedback:
          type: string
          nullable: true
          maxLength: 2000
          description: |
            Bila dihilangkan, feedback sebelumnya dipertahankan; kirim `null`
            untuk mengosongkannya.

    AssignmentResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Assignment'

    AssignmentListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AssignmentListEntry'

    AssignmentDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AssignmentDetail'

    SubmissionResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Submission'

    SubmissionRosterResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SubmissionRoster'

    MySubmissionResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Submission'
              nullable: true

    SelfResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
          description: Token mentah dari tautan email pemulihan kata sandi
        new_password:
          type: string
          format: password
          minLength: 8
          description: Kata sandi baru (wajib memenuhi kebijakan kompleksitas)
        confirm_password:
          type: string
          format: password
          description: Konfirmasi kata sandi baru (opsional, wajib sama bila dikirim)

