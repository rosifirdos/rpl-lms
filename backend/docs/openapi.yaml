          maxLength: 200
        instructions:
          type: string
          maxLength: 2000
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 180
        open_at:
          type: string
          format: date-time
        close_at:
          type: string
          format: date-time

    UpdateQuizRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 200
        instructions:
          type: string
          maxLength: 2000
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 180
        open_at:
          type: string
          format: date-time
        close_at:
          type: string
          format: date-time

    PublishQuizRequest:
